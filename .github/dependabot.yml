version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '06:00'
    timezone: Europe/London
  open-pull-requests-limit: 5
  commit-message:
    prefix: deps
  groups:
    weekly-minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
